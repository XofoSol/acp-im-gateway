[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acp-im-gateway"
version = "1.1.0"
description = "Drive an ACP-speaking coding agent from a chat app (Telegram first)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rodolfo" }]
keywords = ["acp", "telegram", "agent", "gateway", "json-rpc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
]
# Runtime is the Python standard library only. Keep this list empty.
dependencies = []

[project.optional-dependencies]
# Development only. `pytest` is never imported by the runtime code.
dev = ["pytest>=8"]

[project.scripts]
acp-im-gateway = "acp_im_gateway.__main__:main"

[project.urls]
Homepage = "https://github.com/XofoSol/acp-im-gateway"

[tool.setuptools]
packages = ["acp_im_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: spawns the real ACP agent binary; excluded by default in CI-less environments with -m 'not integration'",
]
addopts = "-ra"
